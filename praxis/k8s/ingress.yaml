apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: praxis-ingress
  namespace: praxis
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # If using cert-manager for HTTPS:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: praxis.1337.ma # Must match your DNS and INTRA_REDIRECT_URI
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: praxis-server
            port:
              number: 80
  # Uncomment to enable HTTPS (assuming cert-manager is installed)
  # tls:
  # - hosts:
  #   - praxis.1337.ma
  #   secretName: praxis-tls
