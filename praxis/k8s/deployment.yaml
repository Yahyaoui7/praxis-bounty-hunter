apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-server
  namespace: praxis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: praxis-server
  template:
    metadata:
      labels:
        app: praxis-server
    spec:
      serviceAccountName: praxis-service-account
      containers:
      - name: praxis
        image: praxis:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: praxis-config
        - secretRef:
            name: praxis-secrets
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /login
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /login
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
