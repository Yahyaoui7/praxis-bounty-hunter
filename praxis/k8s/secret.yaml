apiVersion: v1
kind: Secret
metadata:
  name: praxis-secrets
  namespace: praxis
type: Opaque
stringData:
  # CHANGE THESE VALUES BEFORE DEPLOYING!
  SECRET_KEY: "change-me-in-production-to-a-long-random-string"
  ADMIN_PASSWORD: "change-me"
  GITLAB_TOKEN: "change-me"
  INTRA_CLIENT_ID: "change-me"
  INTRA_CLIENT_SECRET: "change-me"
  # Format: postgresql://user:password@host:port/dbname
  DATABASE_URL: "postgresql://praxis:supersecretpassword@praxis-postgres:5432/praxis"
