apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: praxis-postgres
  namespace: praxis
spec:
  serviceName: praxis-postgres
  replicas: 1
  selector:
    matchLabels:
      app: praxis-postgres
  template:
    metadata:
      labels:
        app: praxis-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "praxis"
        - name: POSTGRES_PASSWORD
          value: "supersecretpassword" # Match with secret.yaml
        - name: POSTGRES_DB
          value: "praxis"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-postgres
  namespace: praxis
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: praxis-postgres
